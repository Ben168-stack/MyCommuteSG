<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MyCommute SG{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">MyCommute</span><span class="brand-sg">SG</span>
    </div>
    <div class="tagline">Proactive commute decisions for Singapore</div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    Demo build &middot; all disruption, weather and crowding data is simulated for this hackathon prototype.
  </footer>
</body>
</html>
